name: Publish verified ProxyClient update
on:
  push:
    branches: [main]
    paths: ['Distribution/proxy-import.json', 'scripts/publish_proxy.py', '.github/workflows/publish-proxy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: guest-proxy-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_proxy.py
